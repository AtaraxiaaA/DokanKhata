# builds the React app and puts it on github pages (https://ataraxiaaa.github.io/DokanKhata/)
# runs on every push to main. it's only the frontend: no API or database, so login won't work there
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# don't let two deploys run over each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app for /DokanKhata/
        run: npm run build -w @dokankhata/web
        env:
          PAGES_BASE: /DokanKhata/
          VITE_STATIC_PREVIEW: 'true'
      # github pages has no SPA fallback, so 404.html = index.html lets links like /DokanKhata/login work
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
