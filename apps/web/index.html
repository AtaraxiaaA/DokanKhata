<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7a5f" />
    <meta
      name="description"
      content="DokanKhata — the digital baki khata for Bangladesh's neighbourhood shops."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // set dark mode before the page paints so it doesn't flash (src/lib/theme.tsx)
      try {
        var t = localStorage.getItem('theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>DokanKhata · দোকানখাতা</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
